<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفاتورة</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background-light: #ecf0f1;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--background-light);
            color: var(--text-dark);
            line-height: 1.6;
            direction: rtl;
            padding: 20px;
        }
        .invoice-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 15px;
            overflow: hidden;
        }
        .invoice-header {
            background-color: var(--primary-color);
            color: white;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .invoice-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .invoice-number {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .invoice-title {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }
        .invoice-body {
            padding: 40px;
        }
        .client-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background-color: var(--background-light);
            border-radius: 10px;
            padding: 20px;
        }
        .client-detail-item {
            display: flex;
            align-items: center;
            margin: 0 10px;
        }
        .detail-label {
            color: var(--text-muted);
            font-weight: 600;
            margin-left: 10px;
        }
        .detail-value {
            color: var(--text-dark);
            font-weight: bold;
        }
        .products-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 30px;
        }
        .products-table thead {
            background-color: var(--primary-color);
            color: white;
        }
        .products-table th, .products-table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #e0e4e8;
        }
        .products-table th {
            font-weight: 600;
        }
        .total-section {
            background-color: var(--background-light);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-label {
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        .total-value {
            font-size: 1.5rem;
            color: var(--secondary-color);
            font-weight: bold;
        }
        .qr-barcode-section {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
        }
        .print-button {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 12px 20px;
            background-color: var(--secondary-color);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                margin: 1cm;
                background: white !important;
            }
            .invoice-wrapper {
                box-shadow: none !important;
                width: 100%;
            }
            .invoice-body {
                padding: 20px !important;
            }
            .print-button, 
            .qr-barcode-section {
                display: none !important;
            }
            .client-details,
            .products-table,
            .total-section {
                page-break-inside: avoid;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.0/JsBarcode.all.min.js"></script>
</head>
<body>

    <div class="invoice-wrapper">
        <div class="invoice-header">
            <h1>تفاصيل الفاتورة</h1>
            <div class="invoice-number" id="invoiceNumber"></div>
            <div class="invoice-title" id="invoiceTitle"></div>
        </div>

        <div class="invoice-body">
            <div class="client-details">
                <div class="client-detail-item">
                    <span class="detail-label">اسم العميل</span>
                    <span class="detail-value" id="clientName"></span>
                </div>
                <div class="client-detail-item">
                    <span class="detail-label">تاريخ البدء</span>
                    <span class="detail-value" id="startDate"></span>
                </div>
                <div class="client-detail-item">
                    <span class="detail-label">تاريخ الانتهاء</span>
                    <span class="detail-value" id="endDate"></span>
                </div>
            </div>

            <table class="products-table">
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>مخصومة من بنك</th>
                        <th>السعر</th>
                        <th>الإجمالي</th>
                        <th>ملاحظة</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>

            <div class="total-section">
                <span class="total-label">إجمالي الفاتورة</span>
                <span class="total-value" id="totalPrice"></span>
            </div>

            <div class="qr-barcode-section">
                <div id="qrcode"></div>
                <div id="barcode"></div>
            </div>

            <button onclick="window.print()" class="print-button">
                طباعة الفاتورة
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentInvoice = JSON.parse(localStorage.getItem('currentInvoice'));
            
            if (currentInvoice) {
                // Fill invoice details
                document.getElementById('invoiceNumber').textContent = `فاتورة رقم: ${currentInvoice.id || 'غير محدد'}`;
                document.getElementById('invoiceTitle').textContent = currentInvoice.invoiceTitle || '';

                // Client details
                document.getElementById('clientName').textContent = currentInvoice.clientName || 'غير محدد';
                document.getElementById('startDate').textContent = currentInvoice.startDate || 'غير محدد';
                document.getElementById('endDate').textContent = currentInvoice.endDate || 'غير محدد';

                // Fill products table
                const productsTableBody = document.getElementById('productsTableBody');
                let totalPrice = 0;
                
                if (currentInvoice.products && currentInvoice.products.length > 0) {
                    currentInvoice.products.forEach(product => {
                        const price = parseFloat(product.price) || 0;
                        const quantity = parseInt(product.quantity) || 1;
                        const productTotal = price * quantity;
                        totalPrice += productTotal;
                        
                        const row = `
                            <tr>
                                <td>${product.name || 'غير محدد'}</td>
                                <td>${product.bankDeduction || 'غير محدد'}</td>
                                <td>${price.toFixed(2)} ريال</td>
                                <td>${productTotal.toFixed(2)} ريال</td>
                                <td>${product.note || ''}</td>
                            </tr>
                        `;
                        productsTableBody.innerHTML += row;
                    });
                }

                document.getElementById('totalPrice').textContent = `${totalPrice.toFixed(2)} ريال`;

                // Generate QR Code
                new QRCode(document.getElementById("qrcode"), {
                    text: JSON.stringify(currentInvoice),
                    width: 128,
                    height: 128
                });

                // Generate Barcode
                JsBarcode("#barcode", currentInvoice.id || 'N/A', {
                    format: "CODE128",
                    width: 2,
                    height: 100,
                    displayValue: true
                });
            }
        });
    </script>

</body>
</html>
